spring.application.name=trendtaker
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:trendtaker}
spring.datasource.username=${DB_USER:trendtaker}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
github.token=${GITHUB_TOKEN:}
collect.cron=${COLLECT_CRON:0 5 0 * * *}
collect.manual-enabled=${COLLECT_MANUAL:false}
